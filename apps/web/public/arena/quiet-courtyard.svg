<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#080b16"/><stop offset=".46" stop-color="#17111d"/><stop offset="1" stop-color="#08090e"/></linearGradient>
  <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#40343b"/><stop offset=".5" stop-color="#211e29"/><stop offset="1" stop-color="#12131c"/></linearGradient>
